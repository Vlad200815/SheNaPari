name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes ~2.5 min; without a limit a hung step waits 6 hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/shenapari
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Downloading the SDK from the cache sometimes hangs; fail fast instead.
        timeout-minutes: 4
        with:
          channel: stable
          cache: true
      # One get for the whole workspace (customer app + shenapari_core).
      - run: flutter pub get
      # The shared package first: the app imports its generated colours/logo.
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: mobile/packages/shenapari_core
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile/packages/shenapari_core
      - run: dart run build_runner build --delete-conflicting-outputs
#      - run: flutter analyze
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test