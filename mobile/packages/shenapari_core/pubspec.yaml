name: shenapari_core
description: What the customer app and «ШеНаПарі Кухня» share — network, session, storage, theme, logo.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  google_fonts: ^9.0.0
  material_ui: ^1.11.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.11.0

flutter_gen:
  output: lib/gen/
  line_length: 160
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      # The apps have their own `Assets`; the package's logo comes with its
      # package name, so it loads from here in either app.
      class_name: CoreAssets
      package_parameter_enabled: true
  colors:
    enabled: true
    inputs:
      - assets/color/colors.xml

flutter:
  assets:
    - assets/images/
