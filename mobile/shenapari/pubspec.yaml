###
### Config generate when build
###

flutter_gen:
  output: lib/gen/
  line_length: 160

  integrations:
    flutter_svg: true

  assets:
    enabled: true

  fonts:
    enabled: true

  # Colours (ColorName) and the logo come from shenapari_core.

###
### Flutter package setup
###

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Legal
    # Offline copies of backend/src/ShenaPari.Api/Legal/*.md (keep in sync)
    - assets/legal/

    # Rive: «Rating animation» by JcToon, CC BY 4.0
    # https://rive.app/marketplace/405-6776-rating-animation/
    - assets/rive/rating_stars.riv

    # Sounds (tool/render_success_sound.py)
    - assets/sounds/

    # Images
    - assets/images/
    - assets/images/bottom_nav/
    - assets/images/onboarding/
    - assets/images/auth/
    - assets/images/home/
    - assets/images/flags/
    - assets/images/splash/

    # Translations (easy_localization)
    - assets/translations/




###
### Splash Screen
###

flutter_native_splash:
  # The app background of each mode and the logo, on every platform, so the
  # native splash, Android 12+'s own splash and the Flutter SplashPage look
  # the same (no flash, no jump). Regenerate after a change:
  #   dart run flutter_native_splash:create
  color: "#F4F7F2" # AppColors.light.background (secondary100)
  color_dark: "#121212" # AppColors.dark.background
  # 4x: drawn at 200 pt, the logo itself 150 pt wide.
  image: assets/images/splash/logo_splash.png
  fullscreen: true
  android_12:
    # Android 12+ fits this into its 288 dp icon: the logo is ~150 dp too,
    # inside the 192 dp circle the system crops to.
    image: assets/images/splash/logo.png
    color: "#F4F7F2"
    color_dark: "#121212"
