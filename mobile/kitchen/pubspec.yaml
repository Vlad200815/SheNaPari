name: kitchen
description: «ШеНаПарі Кухня» — the canteen staff app (queue, pickup, stop list).
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Shared with the customer app: network, session, storage, theme, logo.
  shenapari_core:
    path: ../packages/shenapari_core

  audioplayers: ^6.5.1
  dio: ^5.7.0
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  # QR at pickup (the customer's code).
  mobile_scanner: ^7.5.0
  retrofit: ^4.4.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  freezed: ^4.0.1
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.11

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/sounds/

# `dart run flutter_launcher_icons`: the logo on the kitchen's near-black,
# so on a tablet it is never mistaken for the customer app.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icon/foreground.png
